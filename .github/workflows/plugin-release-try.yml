# Tries plugin-release.yml (and the packaging scripts it uses) on the trial
# plugins in plugins/trial (two plugin files, as a repository with several
# plugins has): the same build, packages, tests and checks a plugin repository
# gets, without a release. The files stay under the run for 14
# days; they are the test builds a pull request's description links to.
name: Plugin release (trial)

on:
  pull_request:
    paths:
      - .github/workflows/plugin-release.yml
      - .github/workflows/plugin-publish.yml
      - .github/workflows/plugin-release-try.yml
      - scripts/plugin-package/**
      - plugins/trial/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-try-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: ./.github/workflows/plugin-release.yml
    with:
      name: trial
      title: Trial plugins
      description: Two plugins for trying OxiGuitar's plugin release workflow. Never shipped.
      working-directory: plugins/trial
      # A workspace of two crates: the first's version is the release's.
      package: oxiguitar-trial-first-plugin
      # Their one test (the manifest is valid) runs on every system.
      test: true
      # The scripts under test are this commit's own.
      tools-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    # The called workflow's draft job asks for contents: write (it is
    # skipped here: no tag).
    permissions:
      contents: write

  # plugin-publish.yml reads a release; here there is none, so the checks
  # it makes on the files are made on the staged ones, and its own YAML is
  # parsed.
  publish-checks:
    name: Publish checks
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: The staged files are complete
        run: |
          version="$(ls release/oxiguitar-trial-*-linux-x86_64.zip)"
          version="${version#release/oxiguitar-trial-}"
          version="${version%-linux-x86_64.zip}"
          scripts/plugin-package/check-assets.sh trial "$version" release
      - name: The checker refuses a missing file
        run: |
          version="$(ls release/oxiguitar-trial-*-linux-x86_64.zip)"
          version="${version#release/oxiguitar-trial-}"
          version="${version%-linux-x86_64.zip}"
          rm release/*.pkg
          ! scripts/plugin-package/check-assets.sh trial "$version" release
      - name: The workflows are valid YAML
        run: |
          python3 -c '
          import sys, yaml
          for f in ("plugin-release", "plugin-publish"):
              yaml.safe_load(open(f".github/workflows/{f}.yml"))
          '
