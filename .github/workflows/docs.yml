# The manual (docs/manual/), mdBook.
#
# On pull requests that touch it: build it, so broken links and missing pages
# show up before the merge. It is published by the Site workflow
# (.github/workflows/site.yml), at https://mateusrdp.github.io/oxiguitar-packages/manual/,
# because this repository's Pages site is the package repositories themselves.
name: Manual

on:
  pull_request:
    paths: [docs/manual/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build the manual
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          file="mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/$file"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        # mdBook only warns about a page it can't include; fail instead.
        run: |
          set -o pipefail
          mdbook build docs/manual 2>&1 | tee "$RUNNER_TEMP/mdbook.log"
          if grep -E "WARN|ERROR" "$RUNNER_TEMP/mdbook.log"; then
            echo "::error::mdbook build warned"
            exit 1
          fi
      - name: Check internal links
        # mdBook only warns about a link to a missing page; fail instead.
        run: |
          cd docs/manual/book
          missing=0
          while IFS= read -r -d '' page; do
            while IFS= read -r target; do
              if [ ! -f "$(dirname "$page")/$target" ]; then
                echo "::error::$page links to missing page $target"
                missing=1
              fi
            done < <(grep -o 'href="[^"#:]*\.html' "$page" | sed 's/^href="//')
          done < <(find . -name '*.html' -print0)
          exit $missing
