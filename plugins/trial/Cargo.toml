# Two tiny plugins for trying plugin-release.yml and the packaging scripts
# (.github/workflows/plugin-release-try.yml): a repository with several
# plugins, as oxiguitar-guitarpro is. Never shipped.
[workspace]
members = ["first", "second"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The SDK, from OxiGuitar's repository by tag, as every plugin has it.
oxiguitar-plugin = { git = "https://github.com/mateusrdp/oxiguitar", tag = "v0.11.0" }

[profile.release]
strip = "symbols"
